 <!DOCTYPE html>  

<html lang="en"> 

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ikenna Gallery | Robot Afro Press</title>

  <style>

    body {

      margin: 0;

      padding: 0;

      background: #080808;

      color: white;

      font-family: Arial, sans-serif;

      text-align: center;

    }

    .gallery-page {

      max-width: 1100px;

      margin: 0 auto;

      padding: 50px 20px;

    }

    h1 {

      color: #f2c94c;

      font-size: 42px;

      margin-bottom: 40px;

    }

    .gallery-grid {

      display: grid;

      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));

      gap: 30px;

      margin-bottom: 50px;

    }

    .gallery-item {

      background: #151515;

      border: 2px solid #f2c94c;

      border-radius: 12px;

      padding: 15px;

    }

    .gallery-item img {

      display: block;

      width: 100%;

      height: auto;

      border-radius: 8px;

    }

    .return-button {

      display: inline-block;

      padding: 14px 24px;

      background: #f2c94c;

      color: #080808;

      font-weight: bold;

      text-decoration: none;

      border-radius: 8px;

    }

    .return-button:hover {

      background: white;

    }

    @media (max-width: 600px) {

      h1 {

        font-size: 32px;

      }

      .gallery-page {

        padding: 35px 15px;

      }

    }

  </style>

</head>

<body>

  <main class="gallery-page">

    <h1>Ikenna Gallery</h1>

    <section class="gallery-grid">

      <img src="Original%20Ikenna%20drawing%20with%20Asterope%20.JPG" alt="Original Ikenna drawing with Asterope">

</section>

    <a class="return-button" href="ikenna.html">Return to Ikenna</a>

  </main>

</body>

</html>
