 <!DOCTYPE html> 

<html lang="en"> 

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <title>Vlad Gallery | Robot Afro Press</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      background:

        radial-gradient(circle at top, #3b0808 0%, #170303 32%, #050505 72%);

      color: #f4eee6;

      font-family: Georgia, "Times New Roman", serif;

      text-align: center;

    }

    .gallery-page {

      width: 100%;

      max-width: 1100px;

      min-height: 100vh;

      margin: 0 auto;

      padding: 50px 20px;

    }

    h1 {

      margin: 0 0 15px;

      color: #d7b56d;

      font-size: clamp(2.5rem, 7vw, 4.5rem);

      letter-spacing: 3px;

      text-transform: uppercase;

      text-shadow: 3px 3px 0 #620000;

    }

    .gallery-intro {

      margin: 0 auto 40px;

      color: #ffffff;

      font-size: 1.2rem;

      font-style: italic;

    }

    .gallery-grid {

      display: grid;

      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));

      gap: 30px;

      align-items: start;

      margin-bottom: 50px;

    }

    .gallery-item {

      width: 100%;

      max-width: 400px;

      margin: 0 auto;

      padding: 15px;

      border: 2px solid #8e1515;

      border-radius: 12px;

      background: rgba(0, 0, 0, 0.78);

      box-shadow: 0 0 25px rgba(150, 0, 0, 0.3);

    }

    .gallery-item img {

      display: block;

      width: 100%;

      height: auto;

      border-radius: 8px;

    }

    .return-button {

      display: inline-block;

      margin-top: 20px;

      padding: 15px 28px;

      border: 2px solid #d7b56d;

      border-radius: 6px;

      background: #7c0d0d;

      color: #ffffff;

      font-family: Arial, sans-serif;

      font-weight: bold;

      text-decoration: none;

    }

    .return-button:hover {

      background: #a41717;

    }

    @media (max-width: 600px) {

      .gallery-page {

        padding: 35px 15px;

      }

      .gallery-grid {

        grid-template-columns: 1fr;

      }

    }

  </style>

</head>

<body>

  <main class="gallery-page">

    <h1>Vlad Gallery</h1>

    <p class="gallery-intro">

      Original artwork and character development from Vlad from Cellblock D.

    </p>

    <section class="gallery-grid">

      <div class="gallery-item"><img src="Vlad%20Gallery%20pic%201%20.HEIC" alt="Original artwork of Vlad from Cellblock D" style="width:100%; max-width:350px; height:auto;"></div>

<div class="gallery-item"><img src="Vlad%20OG%20art%20pic%202%20.heic" alt="Original Vlad character artwork" style="width:100%; max-width:350px; height:auto;"></div>

</section>
    <a class="return-button" href="vlad.html">

      ← Return to Vlad from Cellblock D

    </a>

  </main>

</body>

</html>
