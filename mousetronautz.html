    body {

      margin: 0;

    .top-bar {

      position: sticky;

      top: 0;

      padding: 14px;

      text-align: center;

      background: rgba(8, 8, 8, 0.95);

      border-bottom: 1px solid #333;

    }

    .return-button {

      display: inline-block;

      padding: 10px 18px;

      color: white;

      text-decoration: none;

      font-weight: bold;

      border: 2px solid white;

      border-radius: 6px;

    }

    .comic-reader {

      width: 100%;

      max-width: 1100px;

      margin: 0 auto;

      padding: 20px 12px 50px;

    }

    .comic-page {

      display: block;

      width: 100%;

      height: auto;

      margin: 0 auto 24px;

      background: white;

      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.65);

    }

    @media (max-width: 600px) {

      .comic-reader {

        padding: 10px 0 35px;

      }

      .comic-page {

        margin-bottom: 12px;

        box-shadow: none;

      }

    }

  </style>

</head>
